<title>Farm Planning Grid — Managed Virtual Farming</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --sand:#E9E2D3; --sand-dk:#D9CFBB; --card:#FBFAF6; --line:#DED6C6;
    --ink:#1A231C; --muted:#6C7568; --muted-2:#8E9587;
    --green:#1F5C3D; --green-lo:#2E7A50; --green-hi:#E7F0E5;
    --ph-acid:#C77D3A; --ph-ideal:#4C9A5A; --ph-alk:#7B6FB0;
    --temp:#D6482B; --humid:#3E82B5; --danger:#B4462F;
    --radius:14px; --shadow:0 1px 2px rgba(26,35,28,.06), 0 8px 24px rgba(26,35,28,.06);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:hidden}
  body{font-family:var(--sans); color:var(--ink); background:var(--sand); line-height:1.5; -webkit-font-smoothing:antialiased}
  h1,h2,h3{text-wrap:balance; margin:0}
  button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
  .tnum{font-variant-numeric:tabular-nums}
  header{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:14px clamp(16px,4vw,40px); background:rgba(251,250,246,.86); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  .brand{display:flex; align-items:center; gap:12px}
  .brand .mark{width:38px; height:38px; border-radius:11px; flex:none; background:linear-gradient(150deg,var(--green),var(--green-lo)); display:grid; place-items:center; color:#EAF3E7; box-shadow:var(--shadow)}
  .brand h1{font-family:var(--serif); font-size:19px; font-weight:600}
  .brand p{margin:0; font-size:11.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
  nav.crumb{display:flex; align-items:center; gap:6px; font-size:13.5px; flex-wrap:wrap; margin-left:auto}
  nav.crumb button{color:var(--muted); padding:4px 8px; border-radius:8px}
  nav.crumb button:hover{background:var(--sand-dk); color:var(--ink)}
  nav.crumb .cur{color:var(--ink); font-weight:600}
  nav.crumb .sep{color:var(--muted-2); font-size:12px}
  main{padding:clamp(18px,4vw,40px); max-width:1240px; margin:0 auto}
  .view{animation:fade .35s ease}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--green-lo); font-weight:600}
  .lede{color:var(--muted); font-size:14.5px; max-width:64ch; margin:6px 0 0}
  .view-head{margin-bottom:22px}
  .view-head h2{font-family:var(--serif); font-size:clamp(23px,3.6vw,32px); font-weight:600; margin-top:5px}

  .site{position:relative; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--sand-dk); padding:clamp(30px,6vw,64px);
    background:repeating-linear-gradient(38deg, rgba(150,120,80,.05) 0 30px, transparent 30px 62px), repeating-linear-gradient(-52deg, rgba(120,90,55,.04) 0 26px, transparent 26px 60px), radial-gradient(140% 120% at 30% 20%, #E7DBC2, #D3C09E)}
  .palm-edge{position:absolute; display:flex; gap:2.4%; pointer-events:none}
  .palm-edge.top{top:10px; left:4%; right:4%} .palm-edge.bot{bottom:12px; left:4%; right:4%}
  .palm-edge.mid{top:6%; bottom:8%; left:50%; transform:translateX(-50%); flex-direction:column; gap:10px; justify-content:space-between}
  .palm{width:16px; height:16px; border-radius:50%; flex:1; background:radial-gradient(circle at 40% 34%, #6f9152, #3c5a32 72%); box-shadow:0 0 0 2px rgba(211,192,158,.45)}
  .palm-edge.mid .palm{width:14px; height:14px; flex:none}
  .houses{position:relative; z-index:2; display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,2.2vw,22px); max-width:820px; margin:0 auto}
  .ghouse{position:relative; text-align:left; border-radius:6px; overflow:hidden; padding:0; border:1px solid #b9ae93; box-shadow:var(--shadow); transition:transform .3s ease, opacity .3s ease; transform-origin:center}
  .ghouse .roofsat{height:clamp(140px,18vw,200px); position:relative; background:repeating-linear-gradient(0deg, rgba(90,105,95,.16) 0 1px, transparent 1px 7px), repeating-linear-gradient(90deg, rgba(90,110,95,.10) 0 1px, transparent 1px 46px), linear-gradient(180deg,#eef1ec,#dfe4dc)}
  .ghouse .roofsat::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 44px, rgba(70,90,72,.28) 44px 46px)}
  .ghouse .roofsat::after{content:""; position:absolute; inset:0; background:linear-gradient(115deg, rgba(255,255,255,.4), transparent 60%)}
  .ghouse .tagpill{position:absolute; left:10px; top:10px; z-index:3; background:rgba(20,26,20,.62); color:#eef3ea; font-size:11px; font-weight:600; padding:4px 9px; border-radius:8px; backdrop-filter:blur(3px)}
  .ghouse .meta{position:absolute; left:0; right:0; bottom:0; z-index:3; padding:10px 12px 11px; background:linear-gradient(0deg, rgba(20,26,20,.72), rgba(20,26,20,.15) 70%, transparent); color:#f2f5ee}
  .ghouse .meta .r1{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .ghouse h3{font-size:15.5px; font-weight:600}
  .ghouse .dim{font-size:11px; opacity:.85}
  .ghouse .stat{font-size:11.5px; opacity:.92; margin-top:2px}
  .ghouse:hover,.ghouse:focus-visible{transform:scale(1.02); outline:none; box-shadow:0 16px 36px rgba(26,35,28,.24)}
  .ghouse:focus-visible{outline:2px solid var(--green); outline-offset:3px}
  .ghouse.zoom{transform:scale(1.9); opacity:0; z-index:5}
  .houses.leaving .ghouse:not(.zoom){opacity:.25}
  .tank{position:relative; z-index:2; width:96px; height:52px; margin:22px auto 4px; border-radius:5px; border:2px solid #7c8a90; background:linear-gradient(160deg,#5f93b3,#3f6f92); box-shadow:var(--shadow)}
  .tank span{position:absolute; left:50%; bottom:-18px; transform:translateX(-50%); white-space:nowrap; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .wxbar{margin:18px auto 0; max-width:820px; display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 18px; cursor:pointer; text-align:left; width:100%; transition:.15s}
  .wxbar:hover{border-color:var(--green-lo); transform:translateY(-2px)}
  .wxbar .ic{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--green-hi);color:var(--green);font-size:20px}
  .wxbar .t b{font-size:14.5px} .wxbar .t div{font-size:12px;color:var(--muted)}
  .wxbar .now{margin-left:auto;text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted)}
  .wxbar .now b{color:var(--ink)}

  .house-wrap{display:grid; grid-template-columns:1fr; gap:20px}
  @media(min-width:1000px){.house-wrap{grid-template-columns:1fr 320px}}
  .plan-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:clamp(16px,3vw,24px)}
  .toolbar{display:flex; justify-content:space-between; align-items:flex-end; gap:14px 22px; flex-wrap:wrap; margin-bottom:16px}
  .tgroup{display:flex; flex-direction:column; gap:6px}
  .tgroup .lbl{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .seg{display:inline-flex; background:var(--sand); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; flex-wrap:wrap}
  .seg button{padding:7px 12px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--muted); transition:.12s}
  .seg button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
  .seg button:hover:not(.on){color:var(--ink)}
  .arch-labels{display:flex; gap:0; min-width:min-content; padding:0 0 0 var(--pad,10px); margin-bottom:2px}
  .arch-lab{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .arch-lab .clr{text-transform:none; letter-spacing:0; color:var(--danger); font-weight:600; font-size:11.5px; padding:2px 6px; border-radius:6px}
  .arch-lab .clr:hover{background:#faeae6}
  .arch-lab span{color:var(--muted-2); font-family:var(--mono); font-size:10px}

  .matrix-scroll{overflow-x:auto; padding:2px 0 8px}
  .matrixInner{position:relative; width:max-content}
  .grid{display:grid; grid-auto-flow:column; grid-template-rows:repeat(50,11px); grid-auto-columns:11px; gap:1px 3px; padding:10px; background:var(--sand); border:1px solid var(--sand-dk); border-radius:9px}
  .cell{width:11px; height:11px; border-radius:1.5px; border:1px solid rgba(0,0,0,.06); position:relative; transition:transform .1s ease}
  .cell.empty,.cell.pending{background:repeating-linear-gradient(45deg,#eee7d7 0 3px,#e0d8c6 3px 6px)}
  .cell.nodata{background:#ded6c4}
  .cell.dmg{background:#f2ddd6}
  .cell.dmg::after{content:""; position:absolute; inset:1px; background:linear-gradient(45deg,transparent 42%,var(--danger) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--danger) 42% 58%,transparent 58%)}
  .cell.clickable{cursor:pointer}
  .cell.psel{outline:2px solid var(--ink); outline-offset:0; z-index:7}
  .archline{position:absolute; top:6px; bottom:6px; width:2px; background:rgba(60,80,60,.3); z-index:5; pointer-events:none}
  .bedhover{position:absolute; z-index:6; border:2px solid rgba(31,92,61,.6); border-radius:3px; background:rgba(31,92,61,.07); display:none; pointer-events:none}
  .covLayer{position:absolute; inset:0; z-index:6; pointer-events:none}
  .covcircle{position:absolute; transform:translate(-50%,-50%); border:1.5px dashed rgba(31,92,61,.65); background:rgba(31,92,61,.09); border-radius:50%}
  .plantLayer{position:absolute; inset:0; z-index:9; pointer-events:none}
  .runner{position:absolute; font-size:17px; transform:translate(-50%,-60%); transition:left .05s linear, top .05s linear; opacity:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .sensorLayer{position:absolute; inset:0; z-index:8; pointer-events:none}
  .sensorLayer.placing{cursor:crosshair; pointer-events:auto}
  .sensor{position:absolute; transform:translate(-50%,-50%); z-index:9; cursor:pointer; pointer-events:auto; color:var(--green)}
  .sensor svg{display:block; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .sensor:hover{color:var(--green-lo)}
  .axis-note{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:8px; font-size:11.5px; color:var(--muted)}

  .side{display:flex; flex-direction:column; gap:14px}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
  .panel h4{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center}
  .chips{display:flex; flex-wrap:wrap; gap:8px 13px}
  .chip{display:flex; align-items:center; gap:7px; font-size:12.5px}
  .sw{width:13px; height:13px; border-radius:4px; flex:none; border:1px solid rgba(0,0,0,.08)}
  .sw.round{border-radius:50%}
  .mini-btn{font-size:12px; font-weight:600; color:var(--green); padding:5px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card)}
  .mini-btn:hover{background:var(--green-hi); border-color:var(--green-lo)}
  .zone-row{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--line)}
  .zone-row:last-child{border-bottom:none}
  .zone-row b{font-family:var(--mono)}
  table.log{width:100%; border-collapse:collapse; font-size:12px}
  table.log th{text-align:left; color:var(--muted); font-weight:600; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:4px 6px; border-bottom:1px solid var(--line)}
  table.log td{padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top}
  .stat-pill{font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:99px; white-space:nowrap}
  .stat-ok{background:rgba(76,154,90,.16); color:#3c7a48}
  .stat-pest{background:rgba(199,125,58,.16); color:#a4632b}
  .stat-dmg{background:rgba(180,70,47,.16); color:var(--danger)}
  .empty-note{font-size:12.5px; color:var(--muted-2); font-style:italic}
  .sensor-item{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line)}
  .sensor-item:last-child{border-bottom:none}
  .sensor-item button{font-size:11.5px; font-weight:600; color:var(--green)}

  .scrim{position:fixed; inset:0; background:rgba(26,35,28,.34); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:40}
  .scrim.on{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; height:100%; width:min(560px,96vw); z-index:50; background:var(--card); box-shadow:-14px 0 40px rgba(26,35,28,.2); transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.15,1); display:flex; flex-direction:column}
  .drawer.on{transform:none}
  .drawer-head{padding:18px 20px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:12px}
  .drawer-head .id{font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.08em}
  .drawer-head h3{font-family:var(--serif); font-size:21px; font-weight:600; margin-top:3px}
  .drawer-head .x{margin-left:auto; width:34px; height:34px; border-radius:9px; display:grid; place-items:center; color:var(--muted); flex:none}
  .drawer-head .x:hover{background:var(--sand-dk); color:var(--ink)}
  .drawer-body{padding:20px; overflow-y:auto; flex:1}
  .drawer-foot{padding:16px 20px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .btn{padding:11px 18px; border-radius:10px; font-size:14px; font-weight:600; transition:.15s}
  .btn.primary{background:var(--green); color:#fff} .btn.primary:hover{background:var(--green-lo)}
  .btn.primary:disabled{background:var(--sand-dk); color:var(--muted-2); cursor:not-allowed}
  .btn.ghost{color:var(--muted)} .btn.ghost:hover{color:var(--ink)}
  .btn.danger{color:var(--danger); margin-right:auto} .btn.danger:hover{background:#faeae6}
  .picker-note{font-size:13px; color:var(--muted); margin:0 0 16px}
  .crop-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:11px}
  @media(min-width:460px){.crop-grid{grid-template-columns:repeat(3,1fr)}}
  .crop-opt{text-align:left; border:1.5px solid var(--line); border-radius:12px; padding:12px; background:#fff; transition:.15s; display:flex; flex-direction:column; gap:5px}
  .crop-opt:hover{border-color:var(--green-lo); transform:translateY(-2px)}
  .crop-opt.sel{border-color:var(--green); box-shadow:0 0 0 3px var(--green-hi)}
  .crop-opt .dot{width:22px; height:22px; border-radius:7px}
  .crop-opt .nm{font-size:14px; font-weight:600}
  .crop-opt .lat{font-size:11px; color:var(--muted); font-style:italic}
  .crop-opt .cyc{font-size:11px; color:var(--muted)}
  .stepper{display:flex; align-items:center; gap:12px; margin:2px 0 6px}
  .stepper button{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:18px; font-weight:600}
  .stepper button:disabled{opacity:.4; cursor:not-allowed}
  .stepper .val{font-family:var(--mono); font-size:15px; font-weight:600; min-width:150px; text-align:center}
  .kpis{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
  .kpi{flex:1; min-width:120px; background:var(--sand); border:1px solid var(--line); border-radius:11px; padding:11px 13px}
  .kpi .k{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .kpi .v{font-family:var(--mono); font-size:18px; font-weight:600; margin-top:3px} .kpi .v small{font-size:11px; color:var(--muted); font-weight:500}
  .pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px}
  .ptile{background:var(--sand); border:1px solid var(--line); border-radius:9px; padding:8px 10px}
  .ptile .k{font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
  .ptile .v{font-family:var(--mono); font-size:15px; font-weight:600; margin-top:2px} .ptile .v small{font-size:10px; color:var(--muted)}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.04em; margin-bottom:5px; text-transform:uppercase}
  .field input,.field select,.field textarea{width:100%; font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink)}
  .field textarea{resize:vertical; min-height:60px}
  .ts-chart{background:var(--sand); border:1px solid var(--line); border-radius:11px; padding:12px 12px 8px; margin-bottom:12px}
  .ts-chart .th{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px}
  .ts-chart .th b{color:var(--ink); font-family:var(--mono)}
  .influx{font-size:12px; color:var(--muted); background:var(--green-hi); border:1px solid #cfe0cb; border-radius:9px; padding:9px 11px; display:flex; gap:8px; align-items:center; margin-bottom:14px}
  .lane-label{font-size:11px; color:var(--muted); font-family:var(--mono)}
  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:#eaf3e7; padding:12px 20px; border-radius:11px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:.3s; z-index:60; box-shadow:var(--shadow)}
  .toast.on{opacity:1; transform:translate(-50%,0)}
  .ghouse{height:clamp(176px,22vw,220px); background:#e7ecd9}
  .ghouse .roofsat{display:none}
  .ghmini{position:absolute; inset:0; width:100%; height:100%; display:block; opacity:.92; z-index:1}
  .gh-top{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:9px 10px; z-index:3; pointer-events:none}
  .traffic{position:absolute; top:9px; right:10px; z-index:3; display:flex; flex-direction:column; gap:3px; background:rgba(20,26,20,.5); padding:4px 5px; border-radius:9px; backdrop-filter:blur(2px)}
  .tl{width:11px; height:11px; border-radius:50%; background:#3a3f39; opacity:.3}
  .tl.on{opacity:1}
  .tl.red.on{background:#e0563b; box-shadow:0 0 8px #e0563b}
  .tl.amb.on{background:#e7b02e; box-shadow:0 0 8px #e7b02e}
  .tl.grn.on{background:#57c06a; box-shadow:0 0 8px #57c06a}
  .ghouse .meta{background:var(--card); border-top:1px solid var(--line); padding:9px 12px 11px}
  .ghouse .meta .r1{margin-bottom:2px}
  .ghouse h3{color:var(--ink)} .ghouse .dim{color:var(--muted); opacity:1}
  .pbar{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:11px; color:var(--muted)}
  .pbar>span{width:50px; flex:none}
  .pbar .track{flex:1; height:7px; border-radius:99px; background:var(--sand-dk); overflow:hidden}
  .pbar .track i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--green-lo),#5ca772)}
  .pbar .track i.warm{background:linear-gradient(90deg,#E7B02E,#D6482B)}
  .pbar b{width:32px; text-align:right; color:var(--ink); font-family:var(--mono)}
</style>

<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 21c0-6 3-10 8-11-1 7-4 10-8 11Z" fill="currentColor"/><path d="M12 21C8 20 5 16 4 9c5 1 8 5 8 12Z" fill="currentColor" opacity=".7"/><path d="M12 21v-9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
    <div><h1>Al Barari Managed Farm</h1><p>Planting planner</p></div>
  </div>
  <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
</header>
<main id="stage"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  const DAY=86400000, NOW=Date.now();
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmtDate=ms=>{const d=new Date(ms); return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();};
  const fmtShort=ms=>{const d=new Date(ms); return d.getDate()+" "+MON[d.getMonth()];};
  const reduceMotion=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;

  const CROPS={
    tomato:{name:"Tomato", latin:"Solanum lycopersicum", color:"#D6482B", phLo:5.5, phHi:7.0, cycle:90},
    capsicum:{name:"Capsicum", latin:"Capsicum annuum", color:"#E7B02E", phLo:5.5, phHi:7.0, cycle:80},
    cucumber:{name:"Cucumber", latin:"Cucumis sativus", color:"#4EA23C", phLo:5.5, phHi:7.0, cycle:55},
    okra:{name:"Okra", latin:"Abelmoschus esculentus", color:"#9A8F3A", phLo:6.0, phHi:7.5, cycle:60},
    spinach:{name:"Spinach", latin:"Spinacia oleracea", color:"#2E6B43", phLo:6.0, phHi:7.0, cycle:45},
  };
  const CROP_IDS=Object.keys(CROPS);
  const ARCHES=["A","B","C"], BEDS_PER_ARCH=20, PATCHES_PER_BED=50;
  const COLS=ARCHES.length*BEDS_PER_ARCH, ROWS=PATCHES_PER_BED;
  const CELL=11, GX=3, GY=1, PAD=10;
  const R_M=7;     // coverage radius (m)
  const SPREAD=5;   // once a patch reads, +/- this many patches in the same bed are assumed covered
  const PX=CELL+GX, PY=CELL+GY;

  function rng(seed){let x=(seed*2654435761%2147483647)||1; return ()=> (x=x*48271%2147483647)/2147483647;}
  function seedCropFor(hid,arch,col){
    const e=rng(hid*7919+arch.charCodeAt(0)*131+col*17)();
    if(e<0.4) return null;
    return CROP_IDS[Math.floor(rng(hid*104729+arch.charCodeAt(0)*911+col*7)()*CROP_IDS.length)];
  }
  function makeBed(hid,arch,col){
    const id=arch+String(col).padStart(2,"0");
    const b={id,houseId:hid,arch,col,crop:null,plantedAt:null,harvestAt:null,patches:[]};
    const c=seedCropFor(hid,arch,col); if(c) plantBed(b,c,true); return b;
  }
  function plantBed(bed,cropId,seeded){
    const c=CROPS[cropId]; bed.crop=cropId;
    let plantedAt=NOW;
    if(seeded){ plantedAt=NOW-Math.floor(rng(bed.houseId*13+bed.arch.charCodeAt(0)*7+bed.col*3)()*(c.cycle-4))*DAY; }
    bed.plantedAt=plantedAt; bed.harvestAt=plantedAt+c.cycle*DAY; bed.patches=[];
    for(let i=0;i<PATCHES_PER_BED;i++){
      const seed=bed.houseId*1e6+bed.arch.charCodeAt(0)*10007+bed.col*131+i*7+3, r=rng(seed), mid=(c.phLo+c.phHi)/2;
      const ec=+(1.2+r()*1.3).toFixed(2);
      bed.patches.push({idx:i, id:bed.id+"-P"+String(i+1).padStart(2,"0"), ph:+(mid+(r()-0.5)*1.6).toFixed(1),
        moisture:Math.round(46+r()*38), ec, soilTemp:+(22+r()*7).toFixed(1),
        sal:Math.round(ec*640), n:Math.round(40+r()*160), p:Math.round(15+r()*90), k:Math.round(60+r()*220), damaged:false, seed});
    }
  }
  function clearBed(bed){ bed.crop=null; bed.plantedAt=null; bed.harvestAt=null; bed.patches=[]; }

  const HOUSES=[1,2,3,4].map(hid=>({
    id:hid, name:"Greenhouse "+hid, type:"Net House", widthM:60, lengthM:50, arches:ARCHES,
    beds:ARCHES.flatMap(a=>Array.from({length:BEDS_PER_ARCH},(_,i)=>makeBed(hid,a,i+1))),
    sensors:[], inspections:[], sensorSeq:0, inspSeq:0,
    zones:[1,2,3].map(z=>{const r=rng(hid*97+z*31); return {z, temp:+(30+r()*2).toFixed(1), humid:+(48+r()*9).toFixed(1)};}),
  }));
  HOUSES.forEach(h=>{ h.sensors.push({id:"S1",c:20,r:20},{id:"S2",c:40,r:30},{id:"S3",c:7,r:10}); h.sensorSeq=3;
    h.inspections.push({id:"I1", at:NOW-2*DAY, by:"R. Nair", area:"Arch A", status:"ok", notes:"Routine walk-through, canopy healthy."}); });
  const WEATHER={name:"ECOWITT WN90LP", outTemp:36.2, outHumid:46, windSpd:2.3, windDir:280, solar:0, uv:0, pressure:989.6, rain:0.3};

  const plantedCount=h=>h.beds.filter(b=>b.crop).length;
  const cropsInHouse=h=>new Set(h.beds.filter(b=>b.crop).map(b=>b.crop)).size;
  function harvestPct(h){ const pb=h.beds.filter(b=>b.crop); if(!pb.length) return 0; const s=pb.reduce((a,b)=>a+Math.min(1,(NOW-b.plantedAt)/(CROPS[b.crop].cycle*DAY)),0); return Math.round(s/pb.length*100); }
  function houseHealth(h){ let dmg=0; h.beds.forEach(b=>dmg+=b.patches.filter(p=>p.damaged).length); const hasDmg=h.inspections.some(i=>i.status==="damage"), hasPest=h.inspections.some(i=>i.status==="pest"); if(hasDmg||dmg>30) return "red"; if(hasPest||dmg>0) return "amb"; return "grn"; }
  function drawMini(cv,h){ const rect=cv.getBoundingClientRect(); if(!rect.width){ requestAnimationFrame(()=>drawMini(cv,h)); return; }
    const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(rect.width*dpr); cv.height=Math.round(rect.height*dpr);
    const ctx=cv.getContext("2d"), W=cv.width, H=cv.height; ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#d8cba6"; ctx.fillRect(0,0,W,H);                 // tilled soil base
    const bandH=H/3, bedH=bandH/BEDS_PER_ARCH, pw=W/PATCHES_PER_BED;
    for(let a=0;a<3;a++){ const bandTop=(2-a)*bandH;                 // arch A at bottom (CCW)
      for(let k=0;k<BEDS_PER_ARCH;k++){ const bed=h.beds[a*BEDS_PER_ARCH+k], y=bandTop+k*bedH;
        for(let j=0;j<PATCHES_PER_BED;j++){ const p=bed.crop?bed.patches[j]:null; if(!p) continue;
          ctx.globalAlpha=p.damaged?0.5:0.66; ctx.fillStyle=p.damaged?"#c69a8a":CROPS[bed.crop].color; ctx.fillRect(j*pw,y,pw+0.7,bedH+0.7); } } }
    ctx.globalAlpha=1;
    ctx.strokeStyle="rgba(90,80,55,.14)"; ctx.lineWidth=1;           // faint patch columns for field texture
    for(let j=0;j<=PATCHES_PER_BED;j+=5){ ctx.beginPath(); ctx.moveTo(j*pw,0); ctx.lineTo(j*pw,H); ctx.stroke(); }
    ctx.fillStyle="rgba(60,80,60,.32)"; for(let a=1;a<3;a++) ctx.fillRect(0,a*bandH-0.5,W,1.2); }
  const houseById=id=>HOUSES.find(h=>h.id===id);
  const bedById=(h,id)=>h.beds.find(b=>b.id===id);
  // sensor coverage: patch (bedIdx i, row j) center at (i+0.5, j+0.5); sensor at crossing (c,r)
  let COV=null;
  function sensorHits(h,i,j){ const cx=i+0.5, cy=j+0.5; return h.sensors.some(s=>Math.hypot(cx-s.c, cy-s.r)<R_M); }
  function computeCoverage(h){ const map=new Map();
    h.beds.forEach((b,bi)=>{ if(!b.crop) return; const direct=[]; for(let j=0;j<ROWS;j++) if(sensorHits(h,bi,j)) direct.push(j);
      const cov=new Set(); direct.forEach(j=>{ for(let d=-SPREAD;d<=SPREAD;d++){ const r=j+d; if(r>=0&&r<ROWS) cov.add(r); } }); map.set(bi,cov); });
    return map; }
  function covered(h,i,j){ if(COV){ const set=COV.get(i); return !!(set&&set.has(j)); } return sensorHits(h,i,j); }
  function coveredPatchIdxs(h,bedIdx,bed){ const out=[]; for(let j=0;j<bed.patches.length;j++) if(covered(h,bedIdx,j)) out.push(j); return out; }

  function phClass(ph,crop){const c=CROPS[crop];
    if(c&&ph<c.phLo) return {label:"Acidic",key:"acid"};
    if(c&&ph>c.phHi) return {label:"Alkaline",key:"alk"};
    return {label:"Ideal",key:"ideal"};}
  const phColorHex=k=>k==="acid"?"#C77D3A":k==="alk"?"#7B6FB0":"#4C9A5A";
  function hx(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16));}
  function rgb(a){return '#'+a.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');}
  function mix(a,b,t){t=Math.max(0,Math.min(1,t)); const A=hx(a),B=hx(b);return rgb(A.map((v,i)=>Math.round(v+(B[i]-v)*t)));}
  const scale=(v,lo,hi,c0,c1)=>mix(c0,c1,(v-lo)/(hi-lo));
  const SOIL_MODES={ph:1,moist:1,sal:1,n:1,p:1,k:1};
  function cellColor(patch,crop,mode){
    if(mode==="crop") return CROPS[crop].color;
    if(mode==="ph") return phColorHex(phClass(patch.ph,crop).key);
    if(mode==="moist") return scale(patch.moisture,40,85,"#cfe2f0","#2f6d9e");
    if(mode==="sal") return scale(patch.sal,300,2200,"#e3efe9","#1f7a5a");
    if(mode==="n") return scale(patch.n,40,200,"#e9f2e4","#2E6B43");
    if(mode==="p") return scale(patch.p,15,105,"#f6ead9","#B08A2E");
    if(mode==="k") return scale(patch.k,60,280,"#efe8f3","#7B6FB0");
    return CROPS[crop].color;
  }

  let state={level:"farm", houseId:null, tool:"plan", colorMode:"crop", anim:null};
  let animTimer=null;
  const stage=document.getElementById("stage"), crumb=document.getElementById("crumb");
  const drawer=document.getElementById("drawer"), scrim=document.getElementById("scrim"), toastEl=document.getElementById("toast");
  let toastT=null;
  function toast(m){toastEl.textContent=m; toastEl.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("on"),2600);}

  function render(){ renderCrumb(); if(state.level==="farm") renderFarm(); else renderHouse(); window.scrollTo({top:0}); }
  function renderCrumb(){
    let html=`<button ${state.level==="farm"?'class="cur"':''} data-nav="farm">Farm</button>`;
    if(state.houseId){const h=houseById(state.houseId); html+=`<span class="sep">›</span><button class="cur" data-nav="house">${h.name}</button>`;}
    crumb.innerHTML=html;
    crumb.querySelectorAll("button").forEach(b=>b.onclick=()=>{closeDrawer(); if(b.dataset.nav==="farm"){state.level="farm";state.houseId=null;state.anim=null;} render();});
  }

  function renderFarm(){
    const totalBeds=HOUSES.reduce((s,h)=>s+h.beds.length,0), totalPlanted=HOUSES.reduce((s,h)=>s+plantedCount(h),0);
    stage.innerHTML=`
      <div class="view">
        <div class="view-head"><div class="eyebrow">Farm site · company-owned land</div><h2>Farm overview</h2>
          <p class="lede">Four net-house greenhouses in a 2×2 block in the desert, ringed by date palms with a shared water reservoir. ${totalPlanted} of ${totalBeds} beds planted. Select a greenhouse to open its planting grid.</p></div>
        <div class="site"><div class="palm-edge top">${palms(16)}</div><div class="palm-edge bot">${palms(16)}</div><div class="palm-edge mid">${palms(9)}</div>
          <div class="houses">${HOUSES.map(ghouseCard).join("")}</div><div class="tank"><span>Water reservoir</span></div></div>
        <button class="wxbar" id="wxbar"><span class="ic">⛅</span>
          <span class="t"><b>Farm weather station</b><div>${WEATHER.name} · click for live readings &amp; progression</div></span>
          <span class="now"><b class="tnum">${WEATHER.outTemp}°C</b> · ${WEATHER.outHumid}% RH<br>${WEATHER.windSpd} km/h · ${WEATHER.pressure} hPa</span></button>
      </div>`;
    stage.querySelectorAll(".ghouse").forEach(el=>el.onclick=()=>enterHouse(el,+el.dataset.h));
    stage.querySelectorAll(".ghmini").forEach(cv=>drawMini(cv,houseById(+cv.dataset.h)));
    document.getElementById("wxbar").onclick=openWeather;
  }
  const palms=n=>Array.from({length:n}).map(()=>'<span class="palm"></span>').join("");
  function ghouseCard(h){ const planted=plantedCount(h), total=h.beds.length, pPct=Math.round(planted/total*100), hPct=harvestPct(h), st=houseHealth(h), stLabel={red:"Attention needed",amb:"Minor issues",grn:"All good"}[st];
    return `<button class="ghouse" data-h="${h.id}" aria-label="${h.name}, ${planted} of ${total} beds planted, status ${stLabel}">
      <canvas class="ghmini" data-h="${h.id}"></canvas>
      <div class="gh-top"><span class="tagpill">${h.name}</span>
        <span class="traffic" title="Status: ${stLabel}" aria-label="Status: ${stLabel}"><span class="tl red ${st==='red'?'on':''}"></span><span class="tl amb ${st==='amb'?'on':''}"></span><span class="tl grn ${st==='grn'?'on':''}"></span></span></div>
      <div class="meta"><div class="r1"><h3>${h.name}</h3><span class="dim tnum">${h.widthM}×${h.lengthM} m · ${h.sensors.length} sensors</span></div>
        <div class="pbar"><span>Planted</span><div class="track"><i style="width:${pPct}%"></i></div><b class="tnum">${pPct}%</b></div>
        <div class="pbar"><span>Harvest</span><div class="track"><i class="warm" style="width:${hPct}%"></i></div><b class="tnum">${hPct}%</b></div>
      </div></button>`; }
  function enterHouse(el,id){ const go=()=>{state.level="house"; state.houseId=id; state.tool="plan"; state.anim=null; render();};
    if(reduceMotion()) return go(); el.parentElement.classList.add("leaving"); el.classList.add("zoom"); setTimeout(go,360); }

  const COLOR_MODES=[["crop","Crop"],["ph","pH"],["moist","Moisture"],["sal","Salinity"],["n","N"],["p","P"],["k","K"]];
  function renderHouse(){
    const h=houseById(state.houseId), planted=plantedCount(h), total=h.beds.length;
    COV=computeCoverage(h);
    stage.innerHTML=`
      <div class="view">
        <div class="view-head"><div class="eyebrow">${h.type} · ${h.widthM} × ${h.lengthM} m · 3 arches (one house)</div><h2>${h.name} — planting grid</h2>
          <p class="lede">Every 1 × 1 m patch is shown: 60 beds, each a 1 × 50 m strip (a tall column of 50 patches, front at top). Hover a patch to highlight its bed. Soil colours (pH, salinity, N/P/K…) only appear where a sensor covers the patch.</p></div>
        <div class="house-wrap">
          <div class="plan-card">
            <div class="toolbar">
              <div class="tgroup"><span class="lbl">Tool</span><div class="seg" role="tablist">${tab("plan","Plan &amp; plant")}${tab("sensor","Place sensor")}${tab("inspect","Inspect")}</div></div>
              <div class="tgroup"><span class="lbl">Colour by</span><div class="seg">${COLOR_MODES.map(([m,l])=>cbtn(m,l)).join("")}</div></div>
            </div>
            ${toolHint()}
            <div class="arch-labels" style="--pad:${PAD}px">${archLabels(h)}</div>
            <div class="matrix-scroll"><div class="matrixInner" id="mInner" style="width:${gridWidthPx()}px">
              <div class="grid" id="grid">${buildCells(h)}</div>${archLines()}
              <div class="bedhover" id="bedhover"></div>
              <div class="covLayer">${buildCoverage(h)}</div>
              <div class="sensorLayer${state.tool==='sensor'?' placing':''}" id="sensorLayer">${buildSensors(h)}</div>
              <div class="plantLayer"><span class="runner" id="prunner">🏃</span></div>
            </div></div>
            <div class="axis-note"><span>Each column = 1 bed (1 × 50 m). Top = front (P1) → bottom = back (P50). ↔ 60 beds (3 arches × 20)</span><span>${planted}/${total} beds planted</span></div>
          </div>
          <div class="side">${climatePanel(h)}${sidePanels(h)}</div>
        </div>
      </div>`;
    wireHouse(h);
    if(state.anim) runPlantAnim(h);
  }
  const tab=(t,l)=>`<button role="tab" data-tool="${t}" class="${state.tool===t?'on':''}" aria-selected="${state.tool===t}">${l}</button>`;
  const cbtn=(m,l)=>`<button data-cmode="${m}" class="${state.colorMode===m?'on':''}">${l}</button>`;
  function toolHint(){
    const map={plan:"Click a bed to plant it (extend to up to 5 adjacent empty beds) or open its harvest details. Hover a patch to highlight the whole bed.",
      sensor:"Click anywhere on the grid to drop a soil sensor at the nearest patch corner — it reads a 7 m radius zone around the cross (nearby patches in the bed are assumed covered). Click a sensor ✚ for its data.",
      inspect:"Click a patch to select it and report pest/damage — mark a section ✕ and remove its plants."};
    return `<p class="picker-note" style="margin:-4px 0 14px">${map[state.tool]}</p>`;
  }
  function archLabels(h){
    return h.arches.map(a=>{const beds=h.beds.filter(b=>b.arch===a), pl=beds.filter(b=>b.crop).length, w=BEDS_PER_ARCH*PX;
      return `<div class="arch-lab" style="width:${w}px">Arch ${a} <span>${pl}/${BEDS_PER_ARCH}</span>${state.tool==="plan"?`<button class="clr" data-cleararch="${a}">Clear arch</button>`:""}</div>`;}).join("");
  }
  const gridWidthPx=()=>PAD*2+COLS*CELL+(COLS-1)*GX;
  const gridHpx=()=>ROWS*CELL+(ROWS-1)*GY;
  const px=m=>PAD+m*PX-GX/2;   // metric x -> px (also patch-center via i+0.5)
  const py=m=>PAD+m*PY-GY/2;   // metric y -> px
  const cellCX=i=>px(i+0.5), cellCY=r=>py(r+0.5);
  function archLines(){ return [BEDS_PER_ARCH,BEDS_PER_ARCH*2].map(c=>`<div class="archline" style="left:${px(c)}px"></div>`).join(""); }
  function buildCells(h){
    const animSet=state.anim?new Set(state.anim.beds.map(b=>b.id)):null, soil=SOIL_MODES[state.colorMode];
    let s="";
    h.beds.forEach((b,bi)=>{
      const animing=animSet&&animSet.has(b.id);
      for(let r=0;r<PATCHES_PER_BED;r++){
        const p=b.crop?b.patches[r]:null;
        const clickable=(state.tool==="plan")||(state.tool==="inspect"&&p);
        let cls="cell"+(clickable?" clickable":""), style="", title="Bed "+b.id;
        if(!p){ cls+=" empty"; title="Bed "+b.id+" · empty"; }
        else if(p.damaged){ cls+=" dmg"; title=p.id+" · removed (pest/damage)"; }
        else if(animing){ cls+=" pending"; title=p.id; }
        else if(soil && !covered(h,bi,r)){ cls+=" nodata"; title=p.id+" · no sensor data"; }
        else { style=`background:${cellColor(p,b.crop,state.colorMode)}`;
          title=`${p.id} · ${CROPS[b.crop].name} · pH ${p.ph.toFixed(1)} · harvest ~${fmtShort(b.harvestAt)}`; }
        s+=`<div class="${cls}" data-bed="${b.id}" data-bi="${bi}" data-p="${r}" style="${style}" title="${title}"></div>`;
      }
    });
    return s;
  }
  function buildCoverage(h){ return h.sensors.map(sn=>`<div class="covcircle" style="left:${px(sn.c)}px;top:${py(sn.r)}px;width:${2*R_M*PX}px;height:${2*R_M*PY}px"></div>`).join(""); }
  function buildSensors(h){
    return h.sensors.map(sn=>`<div class="sensor" data-sensor="${sn.id}" style="left:${px(sn.c)}px;top:${py(sn.r)}px" title="Sensor ${sn.id}" tabindex="0" role="button" aria-label="Sensor ${sn.id}">
      <svg width="20" height="20" viewBox="0 0 22 22"><path d="M11 1v20M1 11h20" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M11 2v18M2 11h18" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg></div>`).join("");
  }
  function climatePanel(h){ return `<div class="panel"><h4>Greenhouse climate <button class="mini-btn" id="climateBtn">View progression</button></h4>
    ${h.zones.map(z=>`<div class="zone-row"><span>Zone ${z.z} (Arch ${ARCHES[z.z-1]})</span><span><b style="color:var(--temp)">${z.temp}°C</b> · <b style="color:var(--humid)">${z.humid}%</b></span></div>`).join("")}</div>`; }
  function sidePanels(h){ if(state.tool==="sensor") return sensorPanel(h)+legendForColor(); if(state.tool==="inspect") return inspectPanel(h)+legendForColor(); return cropLegend(h)+legendForColor(); }
  function gradLegend(title,c0,c1,lo,hi){ return `<div class="panel"><h4>${title}</h4><div class="chips"><span class="chip"><span class="sw" style="width:74px;background:linear-gradient(90deg,${c0},${c1})"></span></span><span class="chip" style="color:var(--muted)">${lo} → ${hi}</span><span class="chip"><span class="sw" style="background:#ded6c4"></span>No sensor</span></div></div>`; }
  function legendForColor(){
    const m=state.colorMode;
    if(m==="ph") return `<div class="panel"><h4>Soil pH</h4><div class="chips"><span class="chip"><span class="sw round" style="background:var(--ph-acid)"></span>Acidic</span><span class="chip"><span class="sw round" style="background:var(--ph-ideal)"></span>Ideal</span><span class="chip"><span class="sw round" style="background:var(--ph-alk)"></span>Alkaline</span><span class="chip"><span class="sw" style="background:#ded6c4"></span>No sensor</span></div></div>`;
    if(m==="moist") return gradLegend("Soil moisture","#cfe2f0","#2f6d9e","Dry","Wet");
    if(m==="sal") return gradLegend("Salinity (mg/L)","#e3efe9","#1f7a5a","Low","High");
    if(m==="n") return gradLegend("Nitrogen (N)","#e9f2e4","#2E6B43","Low","High");
    if(m==="p") return gradLegend("Phosphorus (P)","#f6ead9","#B08A2E","Low","High");
    if(m==="k") return gradLegend("Potassium (K)","#efe8f3","#7B6FB0","Low","High");
    return "";
  }
  function cropLegend(h){ const used=new Set(h.beds.filter(b=>b.crop).map(b=>b.crop));
    return `<div class="panel"><h4>Crops</h4><div class="chips">${CROP_IDS.map(k=>`<span class="chip" style="opacity:${used.has(k)?1:.42}"><span class="sw" style="background:${CROPS[k].color}"></span>${CROPS[k].name}</span>`).join("")}<span class="chip" style="opacity:.7"><span class="sw" style="background:repeating-linear-gradient(45deg,#eee7d7 0 4px,#e0d8c6 4px 8px)"></span>Empty</span><span class="chip" style="opacity:.85"><span class="sw" style="background:#f2ddd6;border-color:var(--danger)"></span>Removed ✕</span></div></div>`; }
  function sensorPanel(h){ const rows=h.sensors.map(sn=>`<div class="sensor-item"><span>✚ ${sn.id} <span style="color:var(--muted)">· ${sn.c},${sn.r}</span></span><button data-viewsensor="${sn.id}">View</button></div>`).join()||`<div class="empty-note">No sensors yet — click the grid to place one.</div>`;
    return `<div class="panel"><h4>Soil sensors <span class="tnum" style="color:var(--muted);font-weight:600">${h.sensors.length}</span></h4><div style="font-size:12px;color:var(--muted);margin-bottom:8px">Each reads a 7 m radius zone; nearby patches in the same bed are assumed covered. Beds with no sensor show no soil data.</div>${rows}</div>`; }
  function inspectPanel(h){ const rows=h.inspections.slice().reverse().map(ins=>`<tr><td class="tnum">${fmtShort(ins.at)}</td><td>${ins.area}</td><td><span class="stat-pill ${ins.status==='ok'?'stat-ok':ins.status==='pest'?'stat-pest':'stat-dmg'}">${ins.status.toUpperCase()}</span></td><td>${ins.notes||""}</td></tr>`).join()||`<tr><td colspan="4" class="empty-note">No inspections yet.</td></tr>`;
    return `<div class="panel"><h4>Inspections <button class="mini-btn" id="logInsp">＋ Log</button></h4><table class="log"><thead><tr><th>Date</th><th>Area</th><th>Status</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table></div>`; }

  function wireHouse(h){
    stage.querySelectorAll(".seg [data-tool]").forEach(b=>b.onclick=()=>{state.tool=b.dataset.tool; renderHouse();});
    stage.querySelectorAll(".seg [data-cmode]").forEach(b=>b.onclick=()=>{state.colorMode=b.dataset.cmode; renderHouse();});
    stage.querySelectorAll("[data-cleararch]").forEach(b=>b.onclick=()=>clearArch(h,b.dataset.cleararch));
    const grid=document.getElementById("grid"), hover=document.getElementById("bedhover"), mInner=document.getElementById("mInner");
    // hover -> highlight whole bed
    grid.addEventListener("pointermove",e=>{ const c=e.target.closest(".cell"); if(!c){return;} const bi=+c.dataset.bi;
      hover.style.display="block"; hover.style.left=(px(bi)+GX/2-2)+"px"; hover.style.top=(PAD-2)+"px"; hover.style.width=(CELL+4)+"px"; hover.style.height=(gridHpx()+4)+"px"; });
    mInner.addEventListener("pointerleave",()=>{ hover.style.display="none"; });
    // clicks on cells
    grid.querySelectorAll(".cell.clickable").forEach(el=>el.onclick=()=>{ const b=bedById(h,el.dataset.bed), r=+el.dataset.p;
      if(state.tool==="plan") openBed(h,b);
      else if(state.tool==="inspect"){ grid.querySelectorAll(".psel").forEach(x=>x.classList.remove("psel")); el.classList.add("psel"); openDamage(h,b,r); }
    });
    // sensor placement: click anywhere -> nearest crossing
    if(state.tool==="sensor"){ const sl=document.getElementById("sensorLayer");
      sl.querySelectorAll(".sensor").forEach(el=>{el.onclick=e=>{e.stopPropagation(); openSensor(h,el.dataset.sensor);}; el.onkeydown=e=>{if(e.key==="Enter"){openSensor(h,el.dataset.sensor);}};});
      sl.onclick=e=>{ if(e.target.closest(".sensor")) return; const rect=mInner.getBoundingClientRect();
        const x=e.clientX-rect.left, y=e.clientY-rect.top;
        let c=Math.round((x-PAD+GX/2)/PX), rr=Math.round((y-PAD+GY/2)/PY); c=Math.max(0,Math.min(COLS,c)); rr=Math.max(0,Math.min(ROWS,rr));
        const existing=h.sensors.find(s=>s.c===c&&s.r===rr);
        if(existing){ openSensor(h,existing.id); return; }
        const id="S"+(++h.sensorSeq); h.sensors.push({id,c,rr:0,r:rr}); toast(`Placed ${id} at crossing ${c},${rr}`); renderHouse();
      };
    } else {
      document.querySelectorAll(".sensor").forEach(el=>{el.onclick=()=>openSensor(h,el.dataset.sensor); el.onkeydown=e=>{if(e.key==="Enter"){openSensor(h,el.dataset.sensor);}};});
    }
    stage.querySelectorAll("[data-viewsensor]").forEach(b=>b.onclick=()=>openSensor(h,b.dataset.viewsensor));
    const li=document.getElementById("logInsp"); if(li) li.onclick=()=>openInspection(h);
    const cb=document.getElementById("climateBtn"); if(cb) cb.onclick=()=>openClimate(h);
  }
  function clearArch(h,arch){const beds=h.beds.filter(b=>b.arch===arch&&b.crop); if(!beds.length){toast("Arch "+arch+" is already empty");return;} beds.forEach(clearBed); toast(`Cleared ${beds.length} beds in Arch ${arch}`); renderHouse();}

  function runPlantAnim(h){
    const a=state.anim, grid=document.getElementById("grid"), runner=document.getElementById("prunner");
    if(!a||!grid||!runner){ state.anim=null; return; }
    const order=[]; a.beds.forEach(b=>{ const bi=h.beds.indexOf(b); for(let r=0;r<ROWS;r++) order.push({bi,r,b}); });
    const soil=SOIL_MODES[state.colorMode];
    const finish=()=>{ state.anim=null; renderHouse(); toast(`Planted ${a.beds.length} bed(s) with ${CROPS[a.cropId].name}`); };
    if(reduceMotion()){ finish(); return; }
    runner.style.opacity=1; const sc=document.querySelector(".matrix-scroll");
    let n=0; const total=order.length, step=Math.max(14,Math.min(38,Math.round(2600/total)));
    if(animTimer) clearInterval(animTimer);
    animTimer=setInterval(()=>{
      if(n>=total){ clearInterval(animTimer); animTimer=null; finish(); return; }
      const {bi,r,b}=order[n], el=grid.querySelector(`.cell[data-bed="${b.id}"][data-p="${r}"]`);
      if(el){ if(soil&&!covered(h,bi,r)){ el.className="cell clickable nodata"; } else { el.style.background=cellColor(b.patches[r],b.crop,state.colorMode); el.classList.remove("pending"); } }
      runner.style.left=cellCX(bi)+"px"; runner.style.top=cellCY(r)+"px";
      if(sc){ const rx=cellCX(bi); if(rx>sc.scrollLeft+sc.clientWidth-50) sc.scrollLeft=rx-sc.clientWidth+90; if(rx<sc.scrollLeft+40) sc.scrollLeft=Math.max(0,rx-40); }
      n++;
    },step);
  }

  function openDrawer(){drawer.classList.add("on"); scrim.classList.add("on"); drawer.setAttribute("aria-hidden","false");}
  function closeDrawer(){drawer.classList.remove("on"); scrim.classList.remove("on"); drawer.setAttribute("aria-hidden","true");}
  function wireClose(){drawer.querySelectorAll(".x,[data-close]").forEach(el=>el.onclick=closeDrawer);}
  scrim.onclick=closeDrawer;
  document.addEventListener("keydown",e=>{if(e.key==="Escape") closeDrawer();});

  let pickSel=null, pickBeds=1, pickMax=1, pickStart=0;
  function runFromIndex(h,startIdx,want){ const out=[]; for(let i=startIdx;i<h.beds.length&&out.length<want;i++){ if(h.beds[i].crop) break; out.push(i);} return out; }
  function openBed(h,b){ if(b.crop){ renderBedDetail(h,b); openDrawer(); return; }
    pickStart=h.beds.indexOf(b); pickBeds=1; pickSel=null; pickMax=runFromIndex(h,pickStart,5).length; renderPicker(h); openDrawer(); }
  function renderPicker(h){
    const start=h.beds[pickStart], run=runFromIndex(h,pickStart,pickBeds), lastBed=h.beds[pickStart+pickBeds-1];
    const blockedBy=(pickStart+pickMax<h.beds.length && h.beds[pickStart+pickMax].crop)?h.beds[pickStart+pickMax]:null;
    drawer.innerHTML=`
      <div class="drawer-head"><div><div class="id">${h.name} · from Bed ${start.id}</div><h3 id="drawer-title">Pick a plant</h3></div><button class="x" aria-label="Close">✕</button></div>
      <div class="drawer-body">
        <p class="picker-note">One crop per bed (a 1 × 50 m strip of 50 patches). Extend to adjacent empty beds — planting stops at any bed that already has a crop.</p>
        <div class="field"><label>Beds to plant (adjacent, max 5)</label>
          <div class="stepper"><button id="decB" ${pickBeds<=1?'disabled':''}>–</button><span class="val">${run.map(i=>h.beds[i].id).join(", ")} <span style="color:var(--muted)">(${run.length})</span></span><button id="incB" ${pickBeds>=pickMax?'disabled':''}>+</button></div>
          <div style="font-size:12px;color:${blockedBy?'var(--danger)':'var(--muted)'}">${blockedBy?`✕ ${blockedBy.id} is already planted — can't extend past ${lastBed.id}.`:`Up to ${pickMax} empty bed(s) available from here.`}</div></div>
        <div class="field"><label>Crop</label><div class="crop-grid">${CROP_IDS.map(k=>{const c=CROPS[k];return `<button class="crop-opt ${pickSel===k?'sel':''}" data-crop="${k}"><span class="dot" style="background:${c.color}"></span><span class="nm">${c.name}</span><span class="lat">${c.latin}</span><span class="cyc">~${c.cycle} d · pH ${c.phLo}–${c.phHi}</span></button>`;}).join("")}</div></div>
      </div>
      <div class="drawer-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="plantBtn" ${pickSel?'':'disabled'}>Plant ${run.length} bed(s)</button></div>`;
    wireClose();
    const dec=document.getElementById("decB"), inc=document.getElementById("incB");
    if(dec) dec.onclick=()=>{pickBeds=Math.max(1,pickBeds-1); renderPicker(h);};
    if(inc) inc.onclick=()=>{pickBeds=Math.min(pickMax,pickBeds+1); renderPicker(h);};
    drawer.querySelectorAll(".crop-opt").forEach(el=>el.onclick=()=>{pickSel=el.dataset.crop; renderPicker(h);});
    const pb=document.getElementById("plantBtn"); if(pb) pb.onclick=()=>{ if(!pickSel) return;
      const beds=runFromIndex(h,pickStart,pickBeds).map(i=>h.beds[i]);
      beds.forEach(bd=>plantBed(bd,pickSel,false));
      closeDrawer(); state.anim={beds, cropId:pickSel}; renderHouse();
    };
  }
  function renderBedDetail(h,b){
    const c=CROPS[b.crop], days=Math.round((b.harvestAt-NOW)/DAY), dmg=b.patches.filter(p=>p.damaged).length;
    const bedIdx=h.beds.indexOf(b), cov=coveredPatchIdxs(h,bedIdx,b);
    let soilHTML;
    if(cov.length){ const ap=cov.reduce((s,j)=>s+b.patches[j].ph,0)/cov.length, am=cov.reduce((s,j)=>s+b.patches[j].moisture,0)/cov.length;
      soilHTML=`<div class="lane-label" style="margin:2px 0 8px">Soil data — from ${cov.length} sensor-covered patch(es)</div>
        <div class="kpis"><div class="kpi"><div class="k">Avg soil pH</div><div class="v" style="color:${phColorHex(phClass(ap,b.crop).key)}">${ap.toFixed(1)}</div></div>
        <div class="kpi"><div class="k">Avg moisture</div><div class="v">${Math.round(am)}<small>%</small></div></div>
        <div class="kpi"><div class="k">Coverage</div><div class="v">${cov.length}/${b.patches.length}</div></div></div>`;
    } else { soilHTML=`<div class="influx" style="background:#f6efe1;border-color:var(--sand-dk);color:var(--muted)"><span>⚠</span> No sensor covering this bed — no soil data. Switch to <b>Place sensor</b> and drop one on this bed to capture readings.</div>`; }
    drawer.innerHTML=`
      <div class="drawer-head"><div><div class="id">${h.name} · Bed ${b.id}</div><h3 id="drawer-title"><span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:${c.color};margin-right:7px;vertical-align:middle"></span>${c.name}</h3></div><button class="x" aria-label="Close">✕</button></div>
      <div class="drawer-body">
        <div class="kpis"><div class="kpi"><div class="k">Planted</div><div class="v" style="font-size:14px">${fmtDate(b.plantedAt)}</div></div>
          <div class="kpi"><div class="k">Proposed harvest</div><div class="v" style="font-size:14px">${fmtDate(b.harvestAt)}</div></div>
          <div class="kpi"><div class="k">${days>0?"Days to harvest":"Status"}</div><div class="v">${days>0?days:"Ready ✓"}</div></div></div>
        ${soilHTML}
        <p class="picker-note">This bed's ${PATCHES_PER_BED} patches are shown in the grid column${dmg?` · ${dmg} removed`:""}.</p>
      </div>
      <div class="drawer-foot"><button class="btn danger" id="clearB">Clear bed</button><button class="btn ghost" id="changeC">Change crop</button><button class="btn primary" data-close>Done</button></div>`;
    wireClose();
    document.getElementById("changeC").onclick=()=>{clearBed(b); pickStart=h.beds.indexOf(b); pickBeds=1; pickSel=null; pickMax=runFromIndex(h,pickStart,5).length; renderPicker(h);};
    document.getElementById("clearB").onclick=()=>{clearBed(b); toast("Cleared bed "+b.id); renderHouse(); closeDrawer();};
  }

  function seriesPath(seed,base,amp,w,hgt){
    const r=rng(seed), n=24; let pts=[], v=base;
    for(let i=0;i<n;i++){ v+=(r()-0.5)*amp*0.6; v=Math.max(base-amp,Math.min(base+amp,v)); pts.push(v); }
    const min=base-amp*1.25, max=base+amp*1.25, X=i=>6+i*((w-12)/(n-1)), Y=val=>hgt-6-((val-min)/(max-min))*(hgt-12);
    const line=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(p).toFixed(1)}`).join(" ");
    return {line, area:line+` L${X(n-1).toFixed(1)} ${hgt-6} L${X(0).toFixed(1)} ${hgt-6} Z`, last:pts[n-1]};
  }
  function tsChart(seed,color,label,unit,base,amp,dp){
    const w=460,hgt=88,s=seriesPath(seed,base,amp,w,hgt),id="g"+seed;
    return `<div class="ts-chart"><div class="th"><span>${label}</span><b>${s.last.toFixed(dp||0)} ${unit}</b></div>
      <svg viewBox="0 0 ${w} ${hgt}" width="100%" preserveAspectRatio="none" style="height:88px" role="img" aria-label="${label}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${s.area}" fill="url(#${id})"/><path d="${s.line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>
      <div class="th" style="margin-top:2px"><span>−24 h</span><span>now</span></div></div>`;
  }
  function tsChartMulti(title,series){
    const w=460,hgt=104; let paths="",legend="";
    series.forEach(s=>{const sp=seriesPath(s.seed,s.base,s.amp,w,hgt); paths+=`<path d="${sp.line}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
      legend+=`<span class="chip"><span class="sw" style="background:${s.color}"></span>${s.label} <b class="tnum">${sp.last.toFixed(s.dp||0)}${s.unit}</b></span>`;});
    return `<div class="ts-chart"><div class="th"><span>${title}</span><span>−24 h → now</span></div><svg viewBox="0 0 ${w} ${hgt}" width="100%" preserveAspectRatio="none" style="height:104px">${paths}</svg><div class="chips" style="margin-top:6px">${legend}</div></div>`;
  }
  function soilReadings(h,sn){ const b=h.beds[Math.min(sn.c,COLS-1)], p=(b&&b.patches.length)?b.patches[Math.min(sn.r,b.patches.length-1)]:null, r=rng(sn.c*137+sn.r*71+9);
    return { bed:b, temp:p?p.soilTemp:+(24+r()*5).toFixed(1), moist:p?p.moisture:Math.round(45+r()*30), ph:p?p.ph:+(6+r()*1.4).toFixed(1), ec:Math.round((p?p.ec:1.5)*1000), sal:p?p.sal:Math.round(960), n:p?p.n:120, pP:p?p.p:60, k:p?p.k:170, batt:(3.4+r()*0.3).toFixed(2), rssi:-(60+Math.floor(r()*40)) }; }
  function openSensor(h,sid){ const sn=h.sensors.find(s=>s.id===sid); if(!sn) return; const d=soilReadings(h,sn), sd=sn.c*100+sn.r;
    drawer.innerHTML=`
      <div class="drawer-head"><div><div class="id">${h.name} · crossing ${sn.c},${sn.r}</div><h3 id="drawer-title">✚ Soil sensor ${sn.id}</h3></div><button class="x" aria-label="Close">✕</button></div>
      <div class="drawer-body"><div class="influx"><span>◷</span> XZ-DSF3 LoRa soil probe · 7 m radius coverage (nearby patches in the bed share the reading) · sample series shown, will stream from InfluxDB once connected.</div>
        <div class="lane-label" style="margin-bottom:8px">Current readings — all 8 soil elements</div>
        <div class="pgrid" style="margin-bottom:16px">
          <div class="ptile"><div class="k">Soil temp</div><div class="v">${d.temp}<small>°C</small></div></div><div class="ptile"><div class="k">Moisture</div><div class="v">${d.moist}<small>%</small></div></div><div class="ptile"><div class="k">pH</div><div class="v">${d.ph}</div></div><div class="ptile"><div class="k">EC</div><div class="v">${d.ec}<small>µS/cm</small></div></div><div class="ptile"><div class="k">Salinity</div><div class="v">${d.sal}<small>mg/L</small></div></div>
          <div class="ptile"><div class="k">Nitrogen</div><div class="v">${d.n}<small>mg/kg</small></div></div><div class="ptile"><div class="k">Phosphorus</div><div class="v">${d.pP}<small>mg/kg</small></div></div><div class="ptile"><div class="k">Potassium</div><div class="v">${d.k}<small>mg/kg</small></div></div></div>
        <div class="lane-label" style="margin-bottom:8px">24-hour progression</div>
        ${tsChart(sd+11,"#3E82B5","Soil moisture","%",d.moist,14)}${tsChart(sd+22,"#D6482B","Soil temperature","°C",d.temp,4,1)}${tsChart(sd+33,"#C77D3A","Soil pH","pH",d.ph,0.5,1)}${tsChart(sd+44,"#1f7a5a","Salinity","mg/L",d.sal,140)}${tsChart(sd+45,"#7B6FB0","EC","µS/cm",d.ec,220)}
        ${tsChartMulti("NPK (mg/kg)",[{seed:sd+51,color:"#2E6B43",label:"N",unit:"",base:d.n,amp:30},{seed:sd+52,color:"#B08A2E",label:"P",unit:"",base:d.pP,amp:20},{seed:sd+53,color:"#7B6FB0",label:"K",unit:"",base:d.k,amp:40}])}
        <p class="picker-note" style="margin-top:4px">Device: battery ${d.batt} V · RSSI ${d.rssi} dBm · nearest bed <b>${d.bed?d.bed.id:"—"}</b>${d.bed&&d.bed.crop?` (${CROPS[d.bed.crop].name})`:""}.</p></div>
      <div class="drawer-foot"><button class="btn danger" id="rmSensor">Remove sensor</button><button class="btn primary" data-close>Done</button></div>`;
    wireClose(); openDrawer();
    document.getElementById("rmSensor").onclick=()=>{const i=h.sensors.findIndex(s=>s.id===sid); if(i>=0)h.sensors.splice(i,1); toast("Removed "+sid); renderHouse(); closeDrawer();};
  }
  function openClimate(h){
    drawer.innerHTML=`<div class="drawer-head"><div><div class="id">${h.name}</div><h3 id="drawer-title">Greenhouse climate</h3></div><button class="x" aria-label="Close">✕</button></div>
      <div class="drawer-body"><div class="influx"><span>◷</span> Zone air temperature &amp; humidity sensors — one per arch. Sample series; live from the greenhouse controller / InfluxDB later.</div>
      ${h.zones.map(z=>`<div class="lane-label" style="margin-bottom:6px">Zone ${z.z} · Arch ${ARCHES[z.z-1]}</div>${tsChartMulti(`Zone ${z.z} — temp / humidity`,[{seed:h.id*70+z.z*11+1,color:"var(--temp)",label:"Temp",unit:"°C",base:z.temp,amp:3,dp:1},{seed:h.id*70+z.z*11+5,color:"var(--humid)",label:"Humidity",unit:"%",base:z.humid,amp:8,dp:0}])}`).join("")}</div>

  function openWeather(){ const W=WEATHER;

        <div class="lane-label" style="margin-bottom:8px">24-hour progression</div>
        ${tsChartMulti("Outdoor temp / humidity",[{seed:9101,color:"var(--temp)",label:"Temp",unit:"°C",base:W.outTemp,amp:4,dp:1},{seed:9102,color:"var(--humid)",label:"Humidity",unit:"%",base:W.outHumid,amp:8}])}
        ${tsChart(9103,"#00BCD4","Barometric pressure","hPa",W.pressure,3,1)}${tsChart(9104,"#4EA23C","Wind speed","km/h",W.windSpd,2,1)}</div>
      <div class="drawer-foot"><button class="btn primary" data-close>Done</button></div>`;

  function openInspection(h){
    drawer.innerHTML=`<div class="drawer-head"><div><div class="id">${h.name}</div><h3 id="drawer-title">Log inspection</h3></div><button class="x" aria-label="Close">✕</button></div>
      <div class="drawer-body"><div class="field"><label>Inspector</label><input id="insBy" placeholder="Name of farm operator"></div>
        <div class="field"><label>Area</label><input id="insArea" value="Whole house"></div>
        <div class="field"><label>Status</label><select id="insStatus"><option value="ok">OK — healthy</option><option value="pest">Pest observed</option><option value="damage">Damage found</option></select></div>
        <div class="field"><label>Notes</label><textarea id="insNotes" placeholder="Observations…"></textarea></div>
        <p class="picker-note">For patch-level damage, close this and click a patch in the grid (Inspect tool).</p></div>
      <div class="drawer-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="saveInsp">Save inspection</button></div>`;

    document.getElementById("saveInsp").onclick=()=>{ h.inspections.push({id:"I"+(++h.inspSeq), at:NOW, by:document.getElementById("insBy").value.trim()||"Unspecified", area:document.getElementById("insArea").value.trim()||"Whole house", status:document.getElementById("insStatus").value, notes:document.getElementById("insNotes").value.trim()}); toast("Inspection logged"); renderHouse(); closeDrawer(); };
  }
  let dmgLen=3, dmgW=1;
  function openDamage(h,b,startRow){
    if(!b.crop){ toast("Bed "+b.id+" is empty — nothing to inspect"); return; }
    dmgLen=3; dmgW=1; const startCol=h.beds.indexOf(b);
    const draw=()=>{ const el=document.getElementById("dsel"); if(el) el.textContent=`${b.id} P${String(startRow+1).padStart(2,'0')}–P${String(Math.min(startRow+dmgLen,PATCHES_PER_BED)).padStart(2,'0')} × ${dmgW} bed(s)`; };
    drawer.innerHTML=`
      <div class="drawer-head"><div><div class="id">${h.name} · selected ${b.id}-P${String(startRow+1).padStart(2,'0')}</div><h3 id="drawer-title">Report pest / damage</h3></div><button class="x" aria-label="Close">✕</button></div>
      <div class="drawer-body"><p class="picker-note">Marking a section starting at the selected patch as damaged (✕) removes its plants; the ✕ shows on the grid.</p>
        <div class="field"><label>Affected section</label><div class="lane-label" id="dsel" style="margin-bottom:8px"></div>
          <div style="display:flex;gap:22px;flex-wrap:wrap">
            <div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">Patches (length)</div><div class="stepper"><button id="decL">–</button><span class="val" id="vL" style="min-width:44px">${dmgLen}</span><button id="incL">+</button></div></div>
            <div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">Beds (width)</div><div class="stepper"><button id="decW">–</button><span class="val" id="vW" style="min-width:44px">${dmgW}</span><button id="incW">+</button></div></div>
          </div></div>
        <div class="field"><label>Issue</label><select id="dmgStatus"><option value="pest">Pest infestation</option><option value="damage">Physical / disease damage</option></select></div>
        <div class="field"><label>Notes</label><textarea id="dmgNotes" placeholder="What was found…"></textarea></div></div>
      <div class="drawer-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="applyDmg" style="background:var(--danger)">Mark ✕ &amp; remove plants</button></div>`;
    wireClose(); openDrawer(); draw();
    const g=id=>document.getElementById(id);
    g("decL").onclick=()=>{dmgLen=Math.max(1,dmgLen-1);g("vL").textContent=dmgLen;draw();};
    g("incL").onclick=()=>{dmgLen=Math.min(PATCHES_PER_BED-startRow,dmgLen+1);g("vL").textContent=dmgLen;draw();};
    g("decW").onclick=()=>{dmgW=Math.max(1,dmgW-1);g("vW").textContent=dmgW;draw();};
    g("incW").onclick=()=>{dmgW=Math.min(3,dmgW+1);g("vW").textContent=dmgW;draw();};
    g("applyDmg").onclick=()=>{ let n=0;
      for(let dc=0;dc<dmgW;dc++){ const bed=h.beds[startCol+dc]; if(!bed||!bed.crop) continue;
        for(let i=startRow;i<startRow+dmgLen && i<PATCHES_PER_BED;i++){ if(!bed.patches[i].damaged){bed.patches[i].damaged=true; n++;} } }
      const status=g("dmgStatus").value, notes=g("dmgNotes").value.trim();
      h.inspections.push({id:"I"+(++h.inspSeq), at:NOW, by:"Field report", area:`${b.id} P${startRow+1}–P${Math.min(startRow+dmgLen,PATCHES_PER_BED)} ×${dmgW}`, status, notes:notes||`${n} patch(es) removed`});
      toast(`Marked ${n} patch(es) as ${status} & removed plants`); renderHouse(); closeDrawer();
    };
  }

  render();
})();
</script>
